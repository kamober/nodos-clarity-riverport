<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nodos Clarity Riverport</title>
<link rel="icon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Mapa: Leaflet con teselas de OpenStreetMap. Si el CDN no carga, la app dibuja un mapa esquemático. -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" crossorigin="">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app" id="app">
  <aside class="side" id="side" aria-label="Navegación">
    <div class="brand">Nodos <b>Clarity</b><span>Riverport</span></div>
    <nav>
      <div class="sec">Calidad del aire</div>
      <a href="#recientes" data-v="recientes">Datos recientes</a>
      <a href="#historico" data-v="historico">Datos históricos</a>
      <a href="#cumplimiento" data-v="cumplimiento">Cumplimiento de la norma</a>
      <div class="sec">Red de sensores</div>
      <a href="#ubicaciones" data-v="ubicaciones">Ubicaciones</a>
      <div class="sec">Calidad de datos</div>
      <a href="#calidad" data-v="calidad">Control de calidad</a>
      <div class="sec">Datos</div>
      <a href="#importar" data-v="importar">Importar CSV</a>
    </nav>
  </aside>
  <div class="main">
    <header class="bar">
      <button id="burger" class="icon" aria-label="Mostrar u ocultar menú">☰</button>
      <div class="grow"></div>
      <div class="org">Gesoltec Riverport</div>
      <button id="theme" class="btn" aria-label="Cambiar entre tema claro y oscuro">Tema</button>
    </header>
    <main id="view" tabindex="-1"></main>
    <footer class="foot">Resolución 2254 de 2017 · Datos de nodos Clarity · Mapa © colaboradores de OpenStreetMap</footer>
  </div>
</div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
<script src="core.js"></script>
<script src="js/analysis.js"></script>
<script src="js/app.js"></script>
</body>
</html>
